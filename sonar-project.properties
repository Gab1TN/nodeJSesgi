# À adapter avec tes valeurs (visibles dans SonarCloud > ton projet > Information)
sonar.projectKey=ton-org_ton-projet
sonar.organization=ton-org

sonar.sources=src
sonar.tests=tests
# Adapte le pattern à ton projet (ex: **/*.spec.ts)
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/*.spec.js,**/*.spec.ts

# Remonte la couverture générée par Jest/Vitest (reporter lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**