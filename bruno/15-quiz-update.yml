info:
  name: 15 Quiz Update
  type: http
  seq: 15

http:
  method: PUT
  url: http://localhost:3000/api/quizzes/{{quizId}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "title": "Quiz Bruno modifie",
        "description": "Modification ok",
        "questions": [
          {
            "label": "Capitale de l Espagne ?",
            "type": "single",
            "choices": [
              { "label": "Madrid", "isCorrect": true },
              { "label": "Barcelone" }
            ]
          }
        ]
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("quiz title updated", function() {
          expect(res.body.title).to.equal("Quiz Bruno modifie");
        });
        test("questions replaced", function() {
          expect(res.body.questions).to.have.lengthOf(1);
          expect(res.body.questions[0].choices).to.have.lengthOf(2);
        });

